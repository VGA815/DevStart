
server {
    listen 80;
    server_name localhost;

    client_max_body_size 50m;

    # Re-resolve container names per request (see nginx.prod.conf.template) so rebuilding a backend
    # container doesn't leave nginx proxying to a stale IP.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $upstream_api        devstart.webapi:8080;
    set $upstream_minio      minio:9000;
    set $upstream_centrifugo centrifugo:8000;
    set $upstream_matomo     matomo:80;

    # Matomo, mounted at /matomo/ for parity with prod. Matomo is ALSO published directly on
    # :8084, but RUN THE INSTALL WIZARD THROUGH THIS ROUTE (http://localhost:8080/matomo/) so the
    # prefix-strip + X-Forwarded-Uri pair is exercised and the stored URLs have the prod shape.
    #
    # proxy_pass has a TRAILING SLASH, so nginx strips the /matomo/ prefix and the container sees
    # the request at its own document root; X-Forwarded-Uri hands the prefix back, and
    # [General] proxy_uri_header = 1 (config/matomo/common.config.ini.php) makes Matomo prepend it
    # when building absolute URLs. Drop either half and every login redirect and asset URL loses
    # the /matomo prefix.
    location /matomo/ {
        proxy_pass http://$upstream_matomo/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Uri   /matomo;

        # A Matomo version bump runs its DB migration synchronously in the browser; the 60s
        # default would 504 mid-migration.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # `location /matomo/` does not match a bare /matomo — without this it falls through to
    # `location /` and 404s on the API. The redirect stays relative (absolute_redirect off): nginx
    # would otherwise rebuild it from $host, dropping :8080 and pointing at a dead
    # http://localhost/matomo/.
    location = /matomo { absolute_redirect off; return 301 /matomo/; }

    # Defence in depth for Matomo's private directories — mirrors nginx.prod.conf.template. The
    # image does honour .htaccess, but Matomo only generates those files during install, so they
    # are absent on a fresh volume.
    location /matomo/config/ { return 404; }
    location /matomo/tmp/    { return 404; }
    location /matomo/core/   { return 404; }
    location /matomo/lang/   { return 404; }

    location /connection/websocket {
        proxy_pass http://$upstream_centrifugo;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /files/ {
        proxy_pass http://$upstream_minio;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /avatars/ {
        proxy_pass http://$upstream_minio;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /startup-documents/ {
        proxy_pass http://$upstream_minio;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /deal-documents/ {
        proxy_pass http://$upstream_minio;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
