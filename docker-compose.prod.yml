# Production composition. Standalone — run explicitly so dev defaults / overrides are NOT inherited:
#   docker compose -f docker-compose.prod.yml up -d
# All secrets come from `.env`
services:
  devstart.webapi:
    image: ${DOCKER_REGISTRY-}devstartwebapi
    build:
      context: .
      dockerfile: src/DevStart.WebApi/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__Database: "Host=main-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__ExpirationInMinutes: "${JWT_EXPIRATION_MINUTES}"
      Jwt__RequireHttpsMetadata: "true"

      TwoFactor__EncryptionKey: "${TWO_FACTOR_ENCRYPTION_KEY}"
      TwoFactor__Issuer: "DevStart"

      TrustedDevices__Enabled: "${TRUSTED_DEVICES_ENABLED:-true}"
      TrustedDevices__MaxTrustDays: "${TRUSTED_DEVICE_MAX_DAYS:-30}"
      TrustedDevices__AdminMaxTrustDays: "${TRUSTED_DEVICE_ADMIN_MAX_DAYS:-7}"

      OAuth__Google__ClientId: "${OAUTH_GOOGLE_CLIENT_ID}"
      OAuth__Google__ClientSecret: "${OAUTH_GOOGLE_CLIENT_SECRET}"
      OAuth__Google__RedirectUri: "${OAUTH_GOOGLE_REDIRECT_URI}"
      OAuth__GitHub__ClientId: "${OAUTH_GITHUB_CLIENT_ID}"
      OAuth__GitHub__ClientSecret: "${OAUTH_GITHUB_CLIENT_SECRET}"
      OAuth__GitHub__RedirectUri: "${OAUTH_GITHUB_REDIRECT_URI}"

      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "${MINIO_ROOT_USER}"
      Minio__SecretKey: "${MINIO_ROOT_PASSWORD}"
      Minio__Bucket: "${MINIO_BUCKET}"
      Minio__UseSsl: "${MINIO_USE_SSL}"
      # Public endpoint = the API domain; presigned URLs are served as https through nginx (/files).
      Minio__PubEndpoint: "${MINIO_PUB_ENDPOINT}"
      Minio__PubUseSsl: "${MINIO_PUB_USE_SSL}"

      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false"
      Redis__InstanceName: "app"

      Smtp__Host: "${SMTP_HOST}"
      Smtp__Port: "${SMTP_PORT}"
      Smtp__EnableSsl: "${SMTP_ENABLE_SSL}"
      Smtp__UseDefaultCredentials: "false"
      Smtp__Username: "${SMTP_USERNAME}"
      Smtp__Password: "${SMTP_PASSWORD}"

      Centrifugo__ApiUrl: "http://centrifugo:8000"
      Centrifugo__ApiKey: "${CENTRIFUGO_API_KEY}"
      Centrifugo__TokenHmacSecret: "${CENTRIFUGO_TOKEN_HMAC_SECRET}"
      Centrifugo__TokenExpirationInMinutes: "10"

      YooKassa__ShopId: "${YOOKASSA_SHOP_ID}"
      YooKassa__SecretKey: "${YOOKASSA_SECRET_KEY}"
      YooKassa__ReturnUrl: "${YOOKASSA_RETURN_URL}"

      Frontend__BaseUrl: "${FRONTEND_BASE_URL}"

      ForwardedHeaders__KnownNetworks__0: "${FORWARDED_KNOWN_NETWORKS}"

      # Traces → Tempo via OTLP gRPC; metrics are scraped from /metrics by Prometheus.
      OpenTelemetry__Otlp__Endpoint: "http://tempo:4317"
      # Shared secret nginx stamps after Basic Auth so the Hangfire dashboard filter trusts the proxy.
      Hangfire__Dashboard__ProxyAuthSecret: "${HANGFIRE_DASHBOARD_SECRET}"

    expose:
      - "8080"
    depends_on:
      main-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      centrifugo:
        condition: service_started
    networks:
      - devstart-net

  main-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - main-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devstart-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - devstart-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: minio server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - devstart-net

  centrifugo:
    image: centrifugo/centrifugo:v5
    restart: unless-stopped
    command: centrifugo -c config.json
    environment:
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET}
      # Overrides the placeholder in config.prod.json so the WebSocket origin check follows .env.
      CENTRIFUGO_ALLOWED_ORIGINS: "https://${DOMAIN}"
    volumes:
      - ./config/centrifugo/config.prod.json:/centrifugo/config.json:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - devstart-net

  seq:
    image: datalust/seq:2024.3
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
    volumes:
      - seq-data:/data
    networks:
      - devstart-net

  # --- Observability stack (internal only; reach Grafana via SSH tunnel or an authenticated nginx route) ---
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - devstart-net

  tempo:
    # Pinned: the config schema is Tempo 2.x; :latest (3.x) fails to parse it and crash-loops.
    image: grafana/tempo:2.8.2
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - devstart-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    networks:
      - devstart-net

  # --- Matomo: self-hosted product analytics, served at https://${DOMAIN}/matomo/ ---
  matomo-db:
    # Matomo supports MySQL/MariaDB only — it has NO PostgreSQL driver, so main-db cannot be
    # reused and this is a second RDBMS on the box. Budget ~300 MB for it (DEPLOYMENT.md §2).
    image: mariadb:11.4
    restart: unless-stopped
    # utf8mb4 end to end: MariaDB 11.4 defaults the collation to utf8mb4_uca1400_ai_ci, which
    # Matomo's schema does not expect. The buffer pool is capped so it doesn't crowd out Postgres.
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --max-allowed-packet=64M
      --innodb-buffer-pool-size=192M
    environment:
      MARIADB_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MATOMO_DB_NAME}
      MARIADB_USER: ${MATOMO_DB_USER}
      MARIADB_PASSWORD: ${MATOMO_DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - matomo-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - devstart-net

  matomo:
    image: matomo:5-apache
    restart: unless-stopped
    environment:
      # These only PRE-FILL the database step of the install wizard — they do not skip it.
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: ${MATOMO_DB_USER}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
      MATOMO_DATABASE_DBNAME: ${MATOMO_DB_NAME}
      PHP_MEMORY_LIMIT: ${MATOMO_PHP_MEMORY_LIMIT}
    expose:
      - "80"
    volumes:
      - matomo-data:/var/www/html
      # MUST exist as a FILE and be mounted BEFORE the install wizard is first opened — see the
      # file's own header. A bind mount to a missing host path makes Docker create a directory.
      - ./config/matomo/common.config.prod.ini.php:/var/www/html/config/common.config.ini.php:ro
    depends_on:
      matomo-db:
        condition: service_healthy
    healthcheck:
      # The image ships no curl/wget (Debian slim); PHP is guaranteed. Liveness only — this must
      # go green BEFORE the wizard has run, when there is no config.ini.php and every page 500s.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 768M
    networks:
      - devstart-net

  # Report archiving. Browser-triggered archiving is off (common.config.prod.ini.php), so reports
  # are built here instead — same loop shape as the certbot sidecar.
  # Same image + same volume as `matomo` so console, plugins and version always match; the image
  # entrypoint is replaced so its copy/upgrade logic does not run a second time.
  # user: www-data — core:archive writes into tmp/; running it as root leaves root-owned cache
  # files the Apache worker can no longer write, and the UI starts erroring days later.
  matomo-archive:
    image: matomo:5-apache
    restart: unless-stopped
    user: www-data
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: ${MATOMO_DB_USER}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
      MATOMO_DATABASE_DBNAME: ${MATOMO_DB_NAME}
      PHP_MEMORY_LIMIT: ${MATOMO_PHP_MEMORY_LIMIT}
    volumes:
      - matomo-data:/var/www/html
      - ./config/matomo/common.config.prod.ini.php:/var/www/html/config/common.config.ini.php:ro
    depends_on:
      matomo-db:
        condition: service_healthy
      matomo:
        condition: service_started
    # The config.ini.php guard keeps the loop quiet (and non-failing) until the wizard is done.
    # It retries every 60s while uninstalled instead of sleeping MATOMO_ARCHIVE_INTERVAL: this
    # container comes up with the rest of the stack (DEPLOYMENT.md §8), which is BEFORE the install
    # wizard (§8.1), so on a 6h interval it would print "not installed yet" once and then ignore
    # the finished install for six hours — and `up -d matomo-archive` in §8.1 step 10 does not
    # recreate an already-running container, so `logs -f` just replays that stale line.
    entrypoint: >-
      /bin/sh -c 'trap exit TERM; while :; do
      if [ -f /var/www/html/config/config.ini.php ]; then
      php /var/www/html/console core:archive --url=https://${DOMAIN}/matomo/ || true;
      delay=${MATOMO_ARCHIVE_INTERVAL};
      else echo "matomo not installed yet - retrying in 60s"; delay=60; fi;
      sleep $$delay & wait $${!};
      done'
    networks:
      - devstart-net

  frontend:
    image: devstart-client:latest
    build:
      context: ../devstart-client
      args:
        API_URL: /api
        WS_URL: wss://${DOMAIN}/connection/websocket
        # Absolute public URL baked into robots.txt / sitemap.xml. Without it the image keeps the
        # Dockerfile default (http://localhost:8080) and prod ships crawler files pointing at it.
        SITE_URL: https://${DOMAIN}
        # Matomo is same-origin at /matomo/, so no CORS and no extra CSP host is needed — the
        # commented-out CSP in devstart-client/nginx.conf stays valid as written.
        # MATOMO_SITE_ID is baked into the bundle: changing it needs `up -d --build frontend`.
        MATOMO_URL: /matomo/
        MATOMO_SITE_ID: "${MATOMO_SITE_ID}"
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - devstart-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - devstart.webapi
      - centrifugo
      - minio
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
      HANGFIRE_DASHBOARD_SECRET: "${HANGFIRE_DASHBOARD_SECRET}"
      # Restrict envsubst to these two vars so nginx runtime variables ($host, $http_upgrade, …)
      # in the template are left untouched.
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|HANGFIRE_DASHBOARD_SECRET)$$"
    volumes:
      # Rendered by the image entrypoint (envsubst) to /etc/nginx/conf.d/default.conf on start.
      - ./config/nginx/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./config/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # nginx must start via the image entrypoint or template rendering is skipped ($1 must be "nginx");
    # the loop reloads certs renewed by the certbot sidecar.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g \"daemon off;\"'"
    networks:
      - devstart-net

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - devstart-net

volumes:
  main-db-data:
  minio-data:
  redis-data:
  seq-data:
  prometheus-data:
  tempo-data:
  grafana-data:
  matomo-data:
  matomo-db-data:
  certbot-conf:
  certbot-www:

networks:
  devstart-net:
    driver: bridge
