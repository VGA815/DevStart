# Production composition. Standalone — run explicitly so dev defaults / overrides are NOT inherited:
#   docker compose -f docker-compose.prod.yml up -d
# All secrets come from `.env`
services:
  devstart.webapi:
    image: ${DOCKER_REGISTRY-}devstartwebapi
    build:
      context: .
      dockerfile: src/DevStart.WebApi/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__Database: "Host=main-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__ExpirationInMinutes: "${JWT_EXPIRATION_MINUTES}"
      Jwt__RequireHttpsMetadata: "true"

      TwoFactor__EncryptionKey: "${TWO_FACTOR_ENCRYPTION_KEY}"
      TwoFactor__Issuer: "DevStart"

      OAuth__Google__ClientId: "${OAUTH_GOOGLE_CLIENT_ID}"
      OAuth__Google__ClientSecret: "${OAUTH_GOOGLE_CLIENT_SECRET}"
      OAuth__Google__RedirectUri: "${OAUTH_GOOGLE_REDIRECT_URI}"
      OAuth__GitHub__ClientId: "${OAUTH_GITHUB_CLIENT_ID}"
      OAuth__GitHub__ClientSecret: "${OAUTH_GITHUB_CLIENT_SECRET}"
      OAuth__GitHub__RedirectUri: "${OAUTH_GITHUB_REDIRECT_URI}"

      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "${MINIO_ROOT_USER}"
      Minio__SecretKey: "${MINIO_ROOT_PASSWORD}"
      Minio__Bucket: "${MINIO_BUCKET}"
      Minio__UseSsl: "${MINIO_USE_SSL}"
      # Public endpoint = the API domain; presigned URLs are served as https through nginx (/files).
      Minio__PubEndpoint: "${MINIO_PUB_ENDPOINT}"
      Minio__PubUseSsl: "${MINIO_PUB_USE_SSL}"

      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD},abortConnect=false"
      Redis__InstanceName: "app"

      Smtp__Host: "${SMTP_HOST}"
      Smtp__Port: "${SMTP_PORT}"
      Smtp__EnableSsl: "${SMTP_ENABLE_SSL}"
      Smtp__UseDefaultCredentials: "false"
      Smtp__Username: "${SMTP_USERNAME}"
      Smtp__Password: "${SMTP_PASSWORD}"

      Centrifugo__ApiUrl: "http://centrifugo:8000"
      Centrifugo__ApiKey: "${CENTRIFUGO_API_KEY}"
      Centrifugo__TokenHmacSecret: "${CENTRIFUGO_TOKEN_HMAC_SECRET}"
      Centrifugo__TokenExpirationInMinutes: "10"

      YooKassa__ShopId: "${YOOKASSA_SHOP_ID}"
      YooKassa__SecretKey: "${YOOKASSA_SECRET_KEY}"
      YooKassa__ReturnUrl: "${YOOKASSA_RETURN_URL}"

      Frontend__BaseUrl: "${FRONTEND_BASE_URL}"

      ForwardedHeaders__KnownNetworks__0: "${FORWARDED_KNOWN_NETWORKS}"

      # Traces → Tempo via OTLP gRPC; metrics are scraped from /metrics by Prometheus.
      OpenTelemetry__Otlp__Endpoint: "http://tempo:4317"
      # Shared secret nginx stamps after Basic Auth so the Hangfire dashboard filter trusts the proxy.
      Hangfire__Dashboard__ProxyAuthSecret: "${HANGFIRE_DASHBOARD_SECRET}"

    expose:
      - "8080"
    depends_on:
      main-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      centrifugo:
        condition: service_started
    networks:
      - devstart-net

  main-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - main-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devstart-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - devstart-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: minio server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - devstart-net

  centrifugo:
    image: centrifugo/centrifugo:v5
    restart: unless-stopped
    command: centrifugo -c config.json
    environment:
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET}
      # Overrides the placeholder in config.prod.json so the WebSocket origin check follows .env.
      CENTRIFUGO_ALLOWED_ORIGINS: "https://${DOMAIN}"
    volumes:
      - ./config/centrifugo/config.prod.json:/centrifugo/config.json:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - devstart-net

  seq:
    image: datalust/seq:2024.3
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
    volumes:
      - seq-data:/data
    networks:
      - devstart-net

  # --- Observability stack (internal only; reach Grafana via SSH tunnel or an authenticated nginx route) ---
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - devstart-net

  tempo:
    # Pinned: the config schema is Tempo 2.x; :latest (3.x) fails to parse it and crash-loops.
    image: grafana/tempo:2.8.2
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - devstart-net

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    networks:
      - devstart-net

  frontend:
    image: devstart-client:latest
    build:
      context: ../devstart-client
      args:
        API_URL: /api
        WS_URL: wss://${DOMAIN}/connection/websocket
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - devstart-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - devstart.webapi
      - centrifugo
      - minio
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
      HANGFIRE_DASHBOARD_SECRET: "${HANGFIRE_DASHBOARD_SECRET}"
      # Restrict envsubst to these two vars so nginx runtime variables ($host, $http_upgrade, …)
      # in the template are left untouched.
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|HANGFIRE_DASHBOARD_SECRET)$$"
    volumes:
      # Rendered by the image entrypoint (envsubst) to /etc/nginx/conf.d/default.conf on start.
      - ./config/nginx/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./config/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # nginx must start via the image entrypoint or template rendering is skipped ($1 must be "nginx");
    # the loop reloads certs renewed by the certbot sidecar.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g \"daemon off;\"'"
    networks:
      - devstart-net

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - devstart-net

volumes:
  main-db-data:
  minio-data:
  redis-data:
  seq-data:
  prometheus-data:
  tempo-data:
  grafana-data:
  certbot-conf:
  certbot-www:

networks:
  devstart-net:
    driver: bridge
