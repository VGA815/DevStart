services:
  devstart.webapi:
    image: ${DOCKER_REGISTRY-}devstartwebapi
    build:
      context: .
      dockerfile: src/DevStart.WebApi/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081
    networks:
      - devstart-net
    depends_on:
      - main-db
      - seq
      - minio
      - redis
      - centrifugo
      - mailpit
  main-db:
    container_name: main-db
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_USER: postgres
    ports:
      - 5432:5432
    networks:
      - devstart-net
    volumes:
      - main-db-data:/var/lib/postgresql/data
    healthcheck:
      test: psql -U postgres -q -d postgres -c "SELECT 'ready';"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  seq:
    image: datalust/seq:2024.3
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
    networks:
      - devstart-net
    ports:
      - 8081:80
  minio:
    image: minio/minio:latest
    container_name: minio
    networks:
      - devstart-net
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadminpassword"
    volumes:
      - minio-data:/data
    command: minio server /data --console-address ":9001"
# Redis
  redis:
    image: redis:latest
    container_name: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/var/lib/redis/data
      - ./config/redis/redis.conf:/etc/redis/redis.conf
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: redis-server /etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
    networks:
      - devstart-net
  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v5
    volumes:
      - ./config/centrifugo/config.json:/centrifugo/config.json
    command: centrifugo -c config.json --api_insecure --swagger
    ports:
      - 8082:8000
      - 8083:8001
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - devstart-net
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    networks:
      - devstart-net
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
  # --- Observability stack: metrics (Prometheus), traces (Tempo), dashboards (Grafana) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - devstart-net
  tempo:
    # Pinned: the config schema is Tempo 2.x; :latest (3.x) fails to parse it and crash-loops.
    image: grafana/tempo:2.8.2
    container_name: tempo
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo query API
      - "4317:4317"   # OTLP gRPC ingest
    networks:
      - devstart-net
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    networks:
      - devstart-net
  # --- Matomo: self-hosted product analytics ---
  # UI is reachable two ways on purpose: http://localhost:8080/matomo/ (through nginx, same shape
  # as prod) and http://localhost:8084/ (published port, for quick poking). RUN THE INSTALL WIZARD
  # THROUGH :8080/matomo/ — the prefix-strip + X-Forwarded-Uri pair is the fragile part of this
  # setup and should be exercised locally, not discovered in prod. See DEPLOYMENT.md.
  matomo-db:
    # Matomo supports MySQL/MariaDB only — it has NO PostgreSQL driver, so main-db cannot be
    # reused and this is a second RDBMS on the box.
    image: mariadb:11.4
    container_name: matomo-db
    restart: unless-stopped
    # utf8mb4 end to end: MariaDB 11.4 defaults the collation to utf8mb4_uca1400_ai_ci, which
    # Matomo's schema does not expect. Buffer pool is capped so it doesn't crowd out Postgres.
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --max-allowed-packet=64M
      --innodb-buffer-pool-size=128M
    environment:
      MARIADB_ROOT_PASSWORD: matomo_root
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: matomo
      MARIADB_AUTO_UPGRADE: "1"
    # No published port: 3306 commonly collides with a locally installed MySQL, and nothing on the
    # host needs it. Use: docker compose exec matomo-db mariadb -umatomo -pmatomo matomo
    volumes:
      - matomo-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - devstart-net

  matomo:
    image: matomo:5-apache
    container_name: matomo
    restart: unless-stopped
    environment:
      # These only PRE-FILL the database step of the install wizard — they do not skip it.
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: matomo
      MATOMO_DATABASE_DBNAME: matomo
      PHP_MEMORY_LIMIT: 256M
    ports:
      - "8084:80"
    volumes:
      - matomo-data:/var/www/html
      # Reverse-proxy + archiving overrides. Must exist as a FILE before the first start — a bind
      # mount to a missing host path makes Docker create a directory (same trap as
      # config/nginx/.htpasswd), and the wizard cannot be completed without these settings.
      - ./config/matomo/common.config.ini.php:/var/www/html/config/common.config.ini.php:ro
    depends_on:
      matomo-db:
        condition: service_healthy
    healthcheck:
      # The image ships no curl/wget (Debian slim); PHP is guaranteed. Liveness only — this must
      # go green BEFORE the wizard has run, when there is no config.ini.php and every page 500s.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - devstart-net
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    depends_on:
      - devstart.webapi
      - centrifugo
      - minio
    ports:
      - "8080:80"
    volumes:
      - ./config/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - devstart-net